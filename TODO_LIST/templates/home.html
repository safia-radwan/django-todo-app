{%extends 'main.html'%}
{%block content%}

<div class="container ">
    <div class="row justify-content-evenly">
        <div class="col-4">

            <form method="POST" id='task_form'>
                {% csrf_token %}
              
                {{form}}
                <input type="hidden" name='task_id' id='task_id'>
                <button type="submit" class="btn btn-success">Add</button>

            </form>


        </div>



    </div>
<br>   
    {%for task in tasks%}

    <div class="container " >
        <form method="POST" action="{% url 'change_task' task.id %} ">

  
        {% csrf_token %}
        <div class="card">
            <div class="btn-group" role="group">
                <input  type="checkbox" style=" transform: translate(10px);"  onchange=this.form.submit();  {% if task.is_completed %}checked{% endif %}>
                <div class="card-body">

                    {{task}}
                   
                </div>
                <div class="toast-header" style="transform: translate(-950px,0px);">
                    <small>{{task.due_date}}</small>
                </div>
            
            </div>
        </form>
    </div>      
    <div style="display:flex; justify-content:flex-end;">
        <form method="post"  onclick="" style="display: grid;  align-items: center;">
            
            {% csrf_token %}
            
            <button type="button" class="btn btn-warning" style="transform: translate(-50px,-48px);"
        onclick="editTask(
        '{{task.id}}',
        '{{task.task|escapejs}}',
        '{{task.due_date|date:'Y-m-d'}}'
         )">
        <i>edit</i>
        </button>
        </form>
    </div>
    
    <div style="display:flex; justify-content:flex-end;">
        <form method="post" action="{% url 'delete_task' task.id %}" style="display: grid;  align-items: center;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger" style="transform: translate(-2px,-85px);"  onclick="return confirm('Are you sure?')"><i
                    class="fa-duotone fa-solid fa-delete-left"></i></button>
                    
        </form>
    </div>
    
</div>




<script>
function editTask(id, task, date) {

    document.getElementById('id_task').value = task;

    document.getElementById('id_due_date').value = date;

    document.getElementById('task_id').value = id;

    document.getElementById('submitBtn').innerText = 'Update';

}
</script>
{%endfor%}
{%endblock%}
